<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorry, Pinky</title>
<meta name="description" content="A little apology, some memories and a rose, made with love.">
<style>
    /* ==========================================================
       Sorry Pinky - index.html styles
       class prefix: sorry-index-
       ========================================================== */

    :root{
        --bg:#fde6ee;
        --bg2:#f8cfdf;
        --ink:#a8264d;
        --card:#ffc2d6;
        --paper:rgba(255,255,255,.84);
        --text:#5a2a3a;
        --yes:#5fcf9a;
        --no:#ef4457;
        box-sizing:border-box;
        padding-top:env(safe-area-inset-top,0px);
        padding-bottom:env(safe-area-inset-bottom,0px);
    }

    @media (prefers-color-scheme:dark){

        :root:not([data-theme="light"]){
            --bg:#2a1620;
            --bg2:#3b1d2b;
            --ink:#ff9db9;
            --card:#6b2c45;
            --paper:rgba(58,28,42,.9);
            --text:#f6dbe5;
        }

    }

    :root[data-theme="dark"]{
        --bg:#2a1620;
        --bg2:#3b1d2b;
        --ink:#ff9db9;
        --card:#6b2c45;
        --paper:rgba(58,28,42,.9);
        --text:#f6dbe5;
    }

    html,
    body{
        height:100%;
        margin:0;
    }

    body{
        background:radial-gradient(circle at 20% 15%,var(--bg2),transparent 55%),var(--bg);
        font-family:'Baloo 2',system-ui,sans-serif;
        color:var(--ink);
        overflow-x:hidden;
    }

    main{
        min-height:100%;
        display:flex;
        flex-direction:column;
    }

    h1,
    h2,
    p{
        margin:0;
    }

    button{
        font-family:inherit;
        cursor:pointer;
        border:0;
        color:#fff;
        font-weight:800;
    }

    button:focus-visible,
    a:focus-visible{
        outline:3px solid var(--ink);
        outline-offset:3px;
    }

    /* ---------- SCREENS ---------- */

    .sorry-index-screen{
        display:none;
        flex:1 1 auto;
        width:100%;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:1rem;
        padding:1.5rem;
        text-align:center;
        position:relative;
        overflow:hidden;
    }

    .sorry-index-screen.sorry-index-is-on{
        display:flex;
        animation:sorry-index-fade-in .45s ease;
    }

    .sorry-index-screen > *:not(.sorry-index-deco){
        position:relative;
        z-index:1;
    }

    @keyframes sorry-index-fade-in{

        from{
            opacity:0;
            transform:translateY(10px);
        }

        to{
            opacity:1;
            transform:none;
        }

    }

    .sorry-index-title{
        font-size:clamp(1.2rem,4.5vw,1.7rem);
        font-weight:800;
        max-width:22ch;
    }

    .sorry-index-script{
        font-family:'Dancing Script',cursive;
        font-size:1.7rem;
        color:var(--ink);
    }

    .sorry-index-cat{
        width:130px;
        height:auto;
    }

    /* ---------- ASK (YES / NO) ---------- */

    .sorry-index-row{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:1.2rem;
        width:100%;
    }

    .sorry-index-yes,
    .sorry-index-no{
        --s:0;
        border-radius:14px;
        box-shadow:0 6px 0 rgba(0,0,0,.12);
        transition:all .25s;
    }

    .sorry-index-yes{
        background:var(--yes);
        font-size:calc(1.2rem + var(--s)*.6rem);
        padding:calc(.55rem + var(--s)*.4rem) calc(1.6rem + var(--s)*1.5rem);
        max-width:100%;
    }

    .sorry-index-no{
        background:var(--no);
        font-size:max(.55rem,calc(1.15rem - var(--s)*.13rem));
        padding:max(.2rem,calc(.55rem - var(--s)*.06rem)) max(.5rem,calc(1.6rem - var(--s)*.2rem));
    }

    /* ---------- CAT MOODS ---------- */

    #cat .paws,
    #cat .heart,
    #cat .mouth-h{
        display:none;
    }

    #cat[data-m=shy] .paws{
        display:inline;
    }

    #cat[data-m=shy] .eyes{
        display:none;
    }

    #cat[data-m=happy] .mouth-s{
        display:none;
    }

    #cat[data-m=happy] .mouth-h{
        display:inline;
    }

    #cat[data-m=hug] .heart{
        display:inline;
    }

    /* ---------- GIFTS ---------- */

    .sorry-index-gifts{
        display:flex;
        gap:1.1rem;
        align-items:flex-end;
        justify-content:center;
    }

    .sorry-index-gift{
        width:min(26vw,118px);
        aspect-ratio:1;
        border-radius:20px;
        background:var(--card);
        color:var(--ink);
        font-size:.95rem;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        transition:transform .2s;
        box-shadow:0 8px 18px rgba(168,38,77,.18);
    }

    .sorry-index-gift b{
        font-size:2.5rem;
        line-height:1.1;
    }

    .sorry-index-gift:hover,
    .sorry-index-gift:focus-visible{
        transform:scale(1.16);
    }

    .sorry-index-back{
        background:#f06292;
        padding:.45rem 1.6rem;
        border-radius:10px;
        font-size:1rem;
        margin-top:.5rem;
    }

    /* ---------- GIFT 1: PHOTOS ---------- */

    .sorry-index-board{
        display:flex;
        flex-wrap:wrap;
        gap:1rem;
        justify-content:center;
        align-items:center;
        max-width:720px;
    }

    .sorry-index-polaroid{
        width:min(40vw,190px);
        margin:0;
        padding:8px 8px 10px;
        background:#fff;
        box-shadow:0 6px 16px rgba(0,0,0,.18);
        transform:rotate(var(--r));
        transition:transform .25s;
    }

    .sorry-index-polaroid:hover{
        transform:rotate(0) scale(1.06);
        z-index:2;
    }

    .sorry-index-polaroid img{
        display:block;
        width:100%;
        aspect-ratio:1;
        object-fit:cover;
        object-position:var(--pos,center);
        background:#eee;
    }

    .sorry-index-polaroid figcaption{
        font-family:'Dancing Script',cursive;
        font-size:1.25rem;
        line-height:1.5;
        color:#7a3b50;
        text-align:center;
        padding-top:4px;
        min-height:1.5em;
    }

    /* ---------- MUSIC BUTTON (Gift 1 only) ---------- */

    .sorry-index-music{
        position:fixed;
        right:max(14px,env(safe-area-inset-right,0px));
        bottom:max(14px,env(safe-area-inset-bottom,0px));
        z-index:10;
        width:46px;
        height:46px;
        border-radius:50%;
        background:var(--card);
        color:var(--ink);
        font-size:1.3rem;
        box-shadow:0 6px 16px rgba(168,38,77,.25);
        display:none;
    }

    .sorry-index-music.sorry-index-is-on{
        display:block;
    }

    .sorry-index-music.sorry-index-is-off{
        opacity:.55;
        text-decoration:line-through;
    }

    /* ---------- GIFT 2: ROSE ---------- */

    .sorry-index-bubble{
        position:relative;
        max-width:300px;
        padding:.9rem 1.2rem;
        background:var(--paper);
        color:var(--text);
        border-radius:20px;
        font-size:1.25rem;
        font-weight:600;
        line-height:1.3;
        box-shadow:0 8px 22px rgba(168,38,77,.2);
        animation:sorry-index-fade-in .6s .2s both;
    }

    .sorry-index-bubble::after{
        content:"";
        position:absolute;
        left:50%;
        bottom:-12px;
        width:20px;
        height:20px;
        background:inherit;
        transform:translateX(-50%) rotate(45deg);
        border-radius:0 0 6px 0;
    }

    .sorry-index-bubble small{
        display:block;
        margin-top:.3rem;
        font-family:'Dancing Script',cursive;
        font-size:1.3rem;
        color:var(--ink);
        font-weight:600;
    }

    #roseCat{
        width:min(70vw,260px);
        height:auto;
        margin-top:.6rem;
        animation:sorry-index-bob 3s ease-in-out infinite;
    }

    #roseCat .bloom{
        transform-box:fill-box;
        transform-origin:50% 100%;
        animation:sorry-index-pop .9s .4s cubic-bezier(.3,1.6,.5,1) both;
    }

    @keyframes sorry-index-bob{

        50%{
            transform:translateY(-6px);
        }

    }

    @keyframes sorry-index-pop{

        from{
            transform:scale(0) rotate(-40deg);
        }

        to{
            transform:none;
        }

    }

    /* ---------- GIFT 3: LETTER ---------- */

    .sorry-index-paper{
        max-width:640px;
        max-height:68vh;
        overflow:auto;
        padding:1.4rem 1.6rem;
        background:var(--paper);
        border-radius:14px;
        text-align:left;
        font-family:'Cormorant Garamond',Georgia,serif;
        font-size:1.22rem;
        line-height:1.55;
        color:var(--text);
        box-shadow:0 10px 30px rgba(168,38,77,.2);
        position:relative;
    }

    .sorry-index-paper p{
        margin:0 0 .8rem;
        opacity:0;
        animation:sorry-index-fade-in .8s forwards;
        animation-delay:calc(var(--i)*.8s);
    }

    .sorry-index-paper h2{
        font-family:'Dancing Script',cursive;
        font-size:1.9rem;
        margin:0 0 .5rem;
        color:var(--ink);
    }

    .sorry-index-paper .sorry-index-sig{
        text-align:right;
        font-family:'Dancing Script',cursive;
        font-size:1.6rem;
        color:var(--ink);
    }

    /* ---------- DECORATIONS ---------- */

    .sorry-index-deco{
        position:absolute;
        pointer-events:none;
        opacity:.55;
        z-index:0;
    }

    .sorry-index-fall{
        position:fixed;
        top:-8vh;
        font-size:1.6rem;
        pointer-events:none;
        z-index:9;
        animation:sorry-index-fall linear forwards;
    }

    @keyframes sorry-index-fall{

        to{
            transform:translateY(112vh) rotate(360deg);
        }

    }

    /* ---------- PRELOADER ---------- */

    .sorry-index-preloader{
        position:fixed;
        top:0;
        right:0;
        bottom:0;
        left:0;
        z-index:100;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:.6rem;
        padding:1.5rem;
        text-align:center;
        background:radial-gradient(circle at 20% 15%,var(--bg2),transparent 55%),var(--bg);
        transition:opacity .6s ease,visibility .6s ease;
    }

    .sorry-index-preloader.sorry-index-is-hidden{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }

    .sorry-index-pre-cat{
        width:min(55vw,190px);
        height:auto;
        animation:sorry-index-sway 2.6s ease-in-out infinite;
    }

    .sorry-index-pre-tear{
        fill:#7ec8ff;
        stroke:#2b2b2b;
        stroke-width:1.5;
        transform-box:fill-box;
        transform-origin:50% 0;
        animation:sorry-index-tear 1.6s ease-in infinite;
    }

    .sorry-index-pre-tear.sorry-index-pre-tear-r{
        animation-delay:.5s;
    }

    .sorry-index-pre-text{
        font-family:'Dancing Script',cursive;
        font-size:clamp(2rem,8vw,2.8rem);
        color:var(--ink);
        line-height:1.1;
    }

    .sorry-index-pre-dots{
        display:flex;
        gap:.45rem;
        margin-top:.3rem;
    }

    .sorry-index-pre-dots span{
        width:10px;
        height:10px;
        border-radius:50%;
        background:var(--ink);
        animation:sorry-index-dot 1.2s ease-in-out infinite;
    }

    .sorry-index-pre-dots span:nth-child(2){
        animation-delay:.2s;
    }

    .sorry-index-pre-dots span:nth-child(3){
        animation-delay:.4s;
    }

    @keyframes sorry-index-sway{

        0%,
        100%{
            transform:rotate(-3deg);
        }

        50%{
            transform:rotate(3deg) translateY(-4px);
        }

    }

    @keyframes sorry-index-tear{

        0%{
            transform:translateY(0) scale(.6);
            opacity:0;
        }

        20%{
            opacity:1;
            transform:translateY(0) scale(1);
        }

        100%{
            transform:translateY(22px) scale(1);
            opacity:0;
        }

    }

    @keyframes sorry-index-dot{

        0%,
        100%{
            transform:scale(.5);
            opacity:.4;
        }

        50%{
            transform:scale(1);
            opacity:1;
        }

    }

    /* ---------- EFFECTS: AMBIENT + POINTER ---------- */

    .sorry-index-ambient{
        position:fixed;
        top:0;
        right:0;
        bottom:0;
        left:0;
        z-index:0;
        overflow:hidden;
        pointer-events:none;
    }

    .sorry-index-float{
        position:absolute;
        bottom:-8vh;
        opacity:0;
        animation:sorry-index-rise linear forwards;
    }

    .sorry-index-trail,
    .sorry-index-burst{
        position:fixed;
        z-index:50;
        pointer-events:none;
        line-height:1;
    }

    .sorry-index-trail{
        font-size:.9rem;
        animation:sorry-index-trail .9s ease-out forwards;
    }

    .sorry-index-burst{
        font-size:1.1rem;
        animation:sorry-index-burst .8s ease-out forwards;
    }

    @keyframes sorry-index-rise{

        0%{
            opacity:0;
            transform:translate3d(0,0,0) rotate(0deg);
        }

        12%{
            opacity:.6;
        }

        100%{
            opacity:0;
            transform:translate3d(var(--dx,0px),-112vh,0) rotate(40deg);
        }

    }

    @keyframes sorry-index-trail{

        from{
            opacity:1;
            transform:translate(-50%,-50%) scale(1);
        }

        to{
            opacity:0;
            transform:translate(-50%,10px) scale(.3);
        }

    }

    @keyframes sorry-index-burst{

        from{
            opacity:1;
            transform:translate(-50%,-50%) scale(.6);
        }

        to{
            opacity:0;
            transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2);
        }

    }

    /* ---------- EFFECTS: CAT + BUTTONS ---------- */

    #cat{
        animation:sorry-index-bob 3s ease-in-out infinite;
    }

    #cat.sorry-index-shake{
        animation:sorry-index-shake .5s ease-in-out;
    }

    #cat .eyes{
        transform-box:fill-box;
        transform-origin:50% 50%;
        animation:sorry-index-blink 4s infinite;
    }

    #cat .heart{
        transform-box:fill-box;
        transform-origin:50% 50%;
        animation:sorry-index-beat 1.1s ease-in-out infinite;
    }

    .sorry-index-title.sorry-index-swap{
        animation:sorry-index-swap .45s ease;
    }

    .sorry-index-yes{
        animation:sorry-index-ring 1.8s ease-out infinite;
    }

    .sorry-index-yes:active,
    .sorry-index-no:active,
    .sorry-index-back:active{
        transform:translateY(3px);
    }

    .sorry-index-back{
        transition:transform .15s,filter .2s;
    }

    .sorry-index-back:hover{
        filter:brightness(1.08);
        transform:translateY(-2px);
    }

    @keyframes sorry-index-shake{

        0%,
        100%{
            transform:translateX(0) rotate(0);
        }

        20%{
            transform:translateX(-9px) rotate(-6deg);
        }

        40%{
            transform:translateX(9px) rotate(6deg);
        }

        60%{
            transform:translateX(-6px) rotate(-4deg);
        }

        80%{
            transform:translateX(6px) rotate(4deg);
        }

    }

    @keyframes sorry-index-blink{

        0%,
        94%,
        100%{
            transform:scaleY(1);
        }

        97%{
            transform:scaleY(.1);
        }

    }

    @keyframes sorry-index-beat{

        0%,
        100%{
            transform:scale(1);
        }

        30%{
            transform:scale(1.18);
        }

        60%{
            transform:scale(.96);
        }

    }

    @keyframes sorry-index-swap{

        0%{
            opacity:0;
            transform:scale(.85) translateY(8px);
        }

        60%{
            opacity:1;
            transform:scale(1.06);
        }

        100%{
            transform:scale(1);
        }

    }

    @keyframes sorry-index-ring{

        0%{
            box-shadow:0 6px 0 rgba(0,0,0,.12),0 0 0 0 rgba(95,207,154,.65);
        }

        70%,
        100%{
            box-shadow:0 6px 0 rgba(0,0,0,.12),0 0 0 18px rgba(95,207,154,0);
        }

    }

    /* ---------- EFFECTS: GIFTS, PHOTOS, DECORATIONS ---------- */

    .sorry-index-gift b{
        display:block;
        animation:sorry-index-float 2.4s ease-in-out infinite;
        animation-delay:var(--d,0s);
    }

    .sorry-index-gift:hover b,
    .sorry-index-gift:focus-visible b{
        animation:sorry-index-wiggle .5s ease-in-out infinite;
    }

    .sorry-index-gifts .sorry-index-gift:nth-child(2){
        --d:.3s;
    }

    .sorry-index-gifts .sorry-index-gift:nth-child(3){
        --d:.6s;
    }

    .sorry-index-is-on .sorry-index-gift{
        animation:sorry-index-gift-in .6s cubic-bezier(.3,1.5,.5,1) backwards;
    }

    .sorry-index-is-on .sorry-index-gift:nth-child(1){
        animation-delay:.35s;
    }

    .sorry-index-is-on .sorry-index-gift:nth-child(2){
        animation-delay:.5s;
    }

    .sorry-index-is-on .sorry-index-gift:nth-child(3){
        animation-delay:.65s;
    }

    .sorry-index-is-on .sorry-index-polaroid{
        animation:sorry-index-drop .85s cubic-bezier(.3,1.4,.5,1) backwards;
    }

    .sorry-index-is-on .sorry-index-polaroid:nth-child(1){
        animation-delay:.15s;
    }

    .sorry-index-is-on .sorry-index-polaroid:nth-child(2){
        animation-delay:.35s;
    }

    .sorry-index-is-on .sorry-index-polaroid:nth-child(3){
        animation-delay:.55s;
    }

    .sorry-index-deco{
        animation:sorry-index-drift 5s ease-in-out infinite alternate,sorry-index-twinkle 3s ease-in-out infinite;
    }

    .sorry-index-music.sorry-index-is-on{
        animation:sorry-index-music 1.6s ease-out infinite;
    }

    .sorry-index-music.sorry-index-is-off{
        animation:none;
    }

    @keyframes sorry-index-float{

        0%,
        100%{
            transform:translateY(0);
        }

        50%{
            transform:translateY(-7px);
        }

    }

    @keyframes sorry-index-wiggle{

        0%,
        100%{
            transform:rotate(0);
        }

        25%{
            transform:rotate(-14deg) scale(1.1);
        }

        75%{
            transform:rotate(14deg) scale(1.1);
        }

    }

    @keyframes sorry-index-gift-in{

        from{
            opacity:0;
            transform:translateY(40px) scale(.4);
        }

    }

    @keyframes sorry-index-drop{

        from{
            opacity:0;
            transform:translateY(-90px) rotate(0deg) scale(1.3);
        }

    }

    @keyframes sorry-index-drift{

        from{
            translate:0 0;
        }

        to{
            translate:8px -16px;
        }

    }

    @keyframes sorry-index-twinkle{

        0%,
        100%{
            opacity:.25;
        }

        50%{
            opacity:.7;
        }

    }

    @keyframes sorry-index-music{

        0%{
            box-shadow:0 6px 16px rgba(168,38,77,.25),0 0 0 0 rgba(240,98,146,.55);
        }

        70%,
        100%{
            box-shadow:0 6px 16px rgba(168,38,77,.25),0 0 0 14px rgba(240,98,146,0);
        }

    }

    /* ---------- MORE EFFECTS: BACKGROUND + SCREENS ---------- */

    .sorry-index-ambient::before,
    .sorry-index-ambient::after{
        content:"";
        position:absolute;
        width:55vmax;
        height:55vmax;
        border-radius:50%;
        background:radial-gradient(circle,var(--card),transparent 65%);
        filter:blur(40px);
        opacity:.55;
        animation:sorry-index-aurora 14s ease-in-out infinite alternate;
    }

    .sorry-index-ambient::before{
        top:-20vmax;
        left:-15vmax;
    }

    .sorry-index-ambient::after{
        right:-20vmax;
        bottom:-20vmax;
        animation-delay:-7s;
    }

    .sorry-index-screen.sorry-index-is-on{
        animation:sorry-index-screen-in .6s cubic-bezier(.2,.8,.3,1);
    }

    .sorry-index-title{
        background:linear-gradient(90deg,var(--ink),#f06292,var(--ink));
        background-size:200% auto;
        -webkit-background-clip:text;
        background-clip:text;
        -webkit-text-fill-color:transparent;
        color:transparent;
        animation:sorry-index-shimmer 4s linear infinite;
    }

    .sorry-index-title.sorry-index-swap{
        animation:sorry-index-swap .45s ease;
    }

    @keyframes sorry-index-aurora{

        from{
            transform:translate(0,0) scale(1);
        }

        to{
            transform:translate(8vmax,6vmax) scale(1.25);
        }

    }

    @keyframes sorry-index-screen-in{

        from{
            opacity:0;
            transform:translateY(24px) scale(.96);
        }

        to{
            opacity:1;
            transform:none;
        }

    }

    @keyframes sorry-index-shimmer{

        to{
            background-position:200% center;
        }

    }

    /* ---------- MORE EFFECTS: BUTTONS ---------- */

    .sorry-index-yes,
    .sorry-index-gift,
    .sorry-index-back{
        position:relative;
        overflow:hidden;
    }

    .sorry-index-yes::after,
    .sorry-index-gift::after,
    .sorry-index-back::after{
        content:"";
        position:absolute;
        top:0;
        left:-120%;
        width:55%;
        height:100%;
        background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
        transform:skewX(-20deg);
        animation:sorry-index-sweep 3.4s ease-in-out infinite;
        animation-delay:var(--d,0s);
        pointer-events:none;
    }

    .sorry-index-no:hover{
        animation:sorry-index-wobble .4s ease-in-out;
    }

    .sorry-index-gift.sorry-index-opening{
        animation:sorry-index-open .45s ease-in-out;
    }

    #cat.sorry-index-hop{
        animation:sorry-index-hop .7s cubic-bezier(.3,1.4,.5,1);
    }

    @keyframes sorry-index-sweep{

        0%{
            left:-120%;
        }

        40%,
        100%{
            left:150%;
        }

    }

    @keyframes sorry-index-wobble{

        0%,
        100%{
            transform:rotate(0);
        }

        25%{
            transform:rotate(-6deg);
        }

        75%{
            transform:rotate(6deg);
        }

    }

    @keyframes sorry-index-open{

        0%{
            transform:scale(1) rotate(0);
        }

        25%{
            transform:scale(1.15) rotate(-10deg);
        }

        50%{
            transform:scale(1.25) rotate(10deg);
        }

        100%{
            transform:scale(1.45) rotate(0);
            opacity:.5;
        }

    }

    @keyframes sorry-index-hop{

        0%{
            transform:translateY(0) scale(1,1);
        }

        25%{
            transform:translateY(0) scale(1.12,.86);
        }

        55%{
            transform:translateY(-34px) scale(.92,1.1);
        }

        80%{
            transform:translateY(0) scale(1.1,.9);
        }

        100%{
            transform:translateY(0) scale(1,1);
        }

    }

    /* ---------- MORE EFFECTS: PHOTOS, ROSE, LETTER ---------- */

    .sorry-index-polaroid:hover{
        transform:perspective(600px) rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg)) rotate(0) scale(1.06);
    }

    .sorry-index-bubble{
        min-width:min(300px,80vw);
        min-height:5.5rem;
    }

    .sorry-index-sign-in{
        animation:sorry-index-fade-in .8s both;
    }

    .sorry-index-halo{
        opacity:0;
        transform-box:fill-box;
        transform-origin:50% 50%;
        animation:sorry-index-halo 2s ease-out 1.3s infinite;
    }

    .sorry-index-is-on .sorry-index-paper{
        transform-origin:50% 0;
        animation:sorry-index-unfold .9s cubic-bezier(.2,.8,.3,1) backwards;
    }

    .sorry-index-paper p{
        animation-name:sorry-index-slide;
        animation-delay:calc(.5s + var(--i)*.8s);
    }

    .sorry-index-paper h2{
        position:relative;
        display:inline-block;
    }

    .sorry-index-paper h2::after{
        content:"";
        position:absolute;
        left:0;
        bottom:2px;
        width:100%;
        height:3px;
        border-radius:2px;
        background:linear-gradient(90deg,var(--ink),transparent);
        transform:scaleX(0);
        transform-origin:left;
        animation:sorry-index-underline 1s .7s forwards;
    }

    .sorry-index-paper p.sorry-index-sig{
        animation-name:sorry-index-write;
        animation-duration:1.6s;
    }

    @keyframes sorry-index-halo{

        0%{
            opacity:.6;
            transform:scale(.8);
        }

        100%{
            opacity:0;
            transform:scale(1.9);
        }

    }

    @keyframes sorry-index-unfold{

        from{
            opacity:0;
            transform:perspective(800px) rotateX(-70deg) scaleY(.6);
        }

    }

    @keyframes sorry-index-slide{

        from{
            opacity:0;
            transform:translateX(-24px);
        }

        to{
            opacity:1;
            transform:none;
        }

    }

    @keyframes sorry-index-underline{

        to{
            transform:scaleX(1);
        }

    }

    @keyframes sorry-index-write{

        from{
            opacity:1;
            clip-path:inset(0 100% 0 0);
        }

        to{
            opacity:1;
            clip-path:inset(0 0 0 0);
        }

    }

    /* ---------- MORE EFFECTS: PRELOADER ---------- */

    .sorry-index-pre-text span{
        display:inline-block;
        animation:sorry-index-wave 1.4s ease-in-out infinite;
        animation-delay:calc(var(--i)*.08s);
    }

    .sorry-index-pre-bar{
        width:min(60vw,170px);
        height:7px;
        margin-top:.5rem;
        border-radius:6px;
        background:var(--card);
        overflow:hidden;
    }

    .sorry-index-pre-bar span{
        display:block;
        height:100%;
        width:0;
        border-radius:6px;
        background:linear-gradient(90deg,#f06292,var(--ink));
        animation:sorry-index-load 2.4s ease-in-out forwards;
    }

    @keyframes sorry-index-wave{

        0%,
        60%,
        100%{
            transform:translateY(0);
        }

        30%{
            transform:translateY(-9px);
        }

    }

    @keyframes sorry-index-load{

        to{
            width:100%;
        }

    }

    /* ---------- REDUCED MOTION ---------- */

    @media (prefers-reduced-motion:reduce){

        *{
            animation:none !important;
            transition:none !important;
        }

        .sorry-index-paper p{
            opacity:1;
        }

    }
</style>

<script>
(function(){
  'use strict';

  /* ---------- Edit these to personalise ---------- */
  var CONFIG = {
    friend: 'Pinky',
    from: 'Nithya Dharshini',
    song: 'assets/audio1',   // background music in the assets folder (audio1.mp3, .m4a, .wav or .ogg)
    photos: [
      {src:'assets/img 3.jpeg', cap:'Us 💕',          r:-5, pos:'50% 30%'},
      {src:'assets/img 1.jpeg', cap:'Selfie time 🤳', r:4,  pos:'50% 35%'},
      {src:'assets/img 2.jpeg', cap:'Park day 🌳',    r:-3, pos:'50% 45%'}
    ],
    letter: [
      'I know a simple “sorry” is never enough, but I need you to hear it anyway. I’m truly sorry for what I did and for how it made you feel. You never deserved that.',
      'You’re the one who always shows up for me. You listen to my nonsense, you calm me down when I overthink, and you somehow believe in me on days I don’t.',
      'I’ve been replaying everything in my head, and what I miss most is just us: the random laughs, the long talks, the silences that never feel awkward. A friend like you doesn’t come twice, and I never want to take that for granted.',
      'I’m not asking you to forget it right away. I’m only asking for a chance to make it right. Whenever you’re ready, I’m here, with snacks and the biggest hug.'
    ]
  };

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function(s,c){return (c||document).querySelector(s)};
  var $$ = function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s))};

  var msgs = [
    'Okay Pinky… can you forgive me? 🥺',
    'Sooo… can we be good again? 👀',
    'Come on, I said I’m sorryyy 😭',
    'You know you wanna forgive me 😜',
    'Look how big YES is getting… 👀',
    'At this point, NO is barely an option 😭',
    'JUST PRESS YES ALREADY 💚'
  ];
  var n = 0;

  /* ---------- Preloader ---------- */
  var pre = $('#preloader'), preStart = Date.now(), preDone = false;

  function hidePreloader(){
    if(preDone){ return; }
    preDone = true;
    pre.classList.add('sorry-index-is-hidden');
    setTimeout(function(){ pre.remove(); }, 800);
  }

  function schedulePreloader(){
    var wait = Math.max(0, 2400 - (Date.now() - preStart));   // show the sad cat for at least 2.4s
    setTimeout(hidePreloader, wait);
  }

  if(document.readyState === 'complete'){ schedulePreloader(); }
  else { window.addEventListener('load', schedulePreloader); }
  setTimeout(hidePreloader, 6000);   // safety net if a slow asset never finishes

  /* ---------- Screens ---------- */
  var typeTimer, petalTimer, letterTimer;

  function show(id){
    $$('.sorry-index-screen').forEach(function(s){
      s.classList.toggle('sorry-index-is-on', s.id === id);
    });
    $('#' + id).scrollTop = 0;
    if(id === 'p1'){ startMusic(); } else { stopMusic(); }   // music belongs to Gift 1 only

    clearInterval(typeTimer);
    clearInterval(petalTimer);
    clearTimeout(letterTimer);
    if(id === 'rose'){ typeThanks(); startPetals(); }
    if(id === 'p3'){ scheduleLetterBurst(); }
  }

  /* ---------- Gift 2: typewriter bubble + falling petals ---------- */
  function typeThanks(){
    var box = $('#thanks');
    var chars = Array.from('Thank you for accepting my sorry 🌹');
    var i = 0;
    if(reduce){ return; }
    box.innerHTML = '<span></span><small></small>';
    var span = box.firstChild, sm = box.lastChild;
    typeTimer = setInterval(function(){
      if(i < chars.length){
        span.textContent += chars[i++];
      } else {
        clearInterval(typeTimer);
        sm.textContent = '— ' + CONFIG.from;
        sm.className = 'sorry-index-sign-in';
      }
    }, 55);
  }

  function startPetals(){
    if(reduce){ return; }
    var set = ['🌹','🌸','🌷','💗'];
    petalTimer = setInterval(function(){
      var s = document.createElement('span');
      s.className = 'sorry-index-fall';
      s.textContent = set[Math.floor(Math.random() * set.length)];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.fontSize = (1 + Math.random() * 1) + 'rem';
      s.style.animationDuration = (4 + Math.random() * 3) + 's';
      document.body.appendChild(s);
      setTimeout(function(){ s.remove(); }, 7500);
    }, 450);
  }

  /* ---------- Gift 3: a last heart shower once the letter is read ---------- */
  function scheduleLetterBurst(){
    if(reduce){ return; }
    letterTimer = setTimeout(function(){
      burst(['💌','💗','💖','✨','🌸']);
    }, 500 + (CONFIG.letter.length + 1) * 800 + 1200);
  }

  /* ---------- Falling hearts ---------- */
  function burst(set){
    set = set || ['💗','🌸','✨','💖','🎀'];
    for(var i = 0; i < 36; i++){
      var s = document.createElement('span');
      s.className = 'sorry-index-fall';
      s.textContent = set[i % set.length];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
      s.style.animationDelay = Math.random() * .6 + 's';
      document.body.appendChild(s);
      (function(el){ setTimeout(function(){ el.remove(); }, 6500); })(s);
    }
  }

  /* ---------- Effects: restart a one-shot CSS animation ---------- */
  function retrigger(el, cls){
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    el.addEventListener('animationend', function done(){
      el.classList.remove(cls);
      el.removeEventListener('animationend', done);
    });
  }

  /* ---------- Ask: YES / NO ---------- */
  var cat = $('#cat'), yes = $('#yes'), no = $('#no');

  no.addEventListener('click', function(){
    n = Math.min(n + 1, msgs.length - 1);
    $('#q').textContent = msgs[n];
    retrigger(cat, 'sorry-index-shake');
    retrigger($('#q'), 'sorry-index-swap');
    cat.dataset.m = n % 2 ? 'happy' : 'shy';
    yes.style.setProperty('--s', n);
    no.style.setProperty('--s', n);
  });

  yes.addEventListener('click', function(){
    burst();
    retrigger(cat, 'sorry-index-hop');
    cat.dataset.m = 'happy';
    setTimeout(function(){
      $('#slot').appendChild(cat);
      cat.dataset.m = 'hug';
      show('gifts');
    }, 700);
  });

  function go(id){
    show(id);
    if(id === 'rose'){ burst(['🌹','🌸','💗','🌷','✨']); }
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-go]');
    if(!b){ return; }
    if(b.classList.contains('sorry-index-gift') && !reduce){
      if(b.classList.contains('sorry-index-opening')){ return; }
      var icon = b.querySelector('b');
      b.classList.add('sorry-index-opening');
      icon.textContent = '🎉';
      setTimeout(function(){
        b.classList.remove('sorry-index-opening');
        icon.textContent = '🎁';
        go(b.dataset.go);
      }, 450);
      return;
    }
    go(b.dataset.go);
  });

  /* ---------- Gift 1: polaroid photos ---------- */
  CONFIG.photos.forEach(function(ph){
    var f = document.createElement('figure');
    f.className = 'sorry-index-polaroid';
    f.style.setProperty('--r', ph.r + 'deg');
    f.style.setProperty('--pos', ph.pos || 'center');
    var i = new Image();
    i.src = ph.src;
    i.alt = ph.cap || 'A memory of us';
    i.loading = 'lazy';
    var c = document.createElement('figcaption');
    c.textContent = ph.cap || '';
    f.append(i, c);
    $('#board').appendChild(f);

    if(!reduce && window.matchMedia('(hover:hover)').matches){
      f.addEventListener('pointermove', function(e){
        var r = f.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width - .5;
        var y = (e.clientY - r.top) / r.height - .5;
        f.style.setProperty('--ty', (x * 18) + 'deg');
        f.style.setProperty('--tx', (-y * 18) + 'deg');
      });
      f.addEventListener('pointerleave', function(){
        f.style.setProperty('--tx', '0deg');
        f.style.setProperty('--ty', '0deg');
      });
    }
  });

  /* ---------- Background music (plays only on Gift 1) ---------- */
  var bgm = new Audio();
  bgm.loop = true;
  bgm.volume = .6;
  var mbtn = $('#music'), exts = ['mp3','m4a','wav','ogg'], ei = 0, wanted = false;

  function tryPlay(){
    bgm.play().then(function(){
      if(wanted){ mbtn.classList.add('sorry-index-is-on'); }
      else { bgm.pause(); bgm.currentTime = 0; }
    }).catch(function(){});
  }

  function startMusic(){
    if(!CONFIG.song){ return; }
    wanted = true;
    mbtn.classList.remove('sorry-index-is-off');
    tryPlay();
  }

  function stopMusic(){
    wanted = false;
    bgm.pause();
    bgm.currentTime = 0;
    mbtn.classList.remove('sorry-index-is-on', 'sorry-index-is-off');
  }

  if(CONFIG.song){
    bgm.src = CONFIG.song + '.' + exts[0];
    bgm.addEventListener('error', function(){
      if(++ei < exts.length){
        bgm.src = CONFIG.song + '.' + exts[ei];
        if(wanted){ tryPlay(); }
      } else {
        mbtn.classList.remove('sorry-index-is-on');
      }
    });
    mbtn.addEventListener('click', function(){
      if(!wanted){ return; }
      if(bgm.paused){
        bgm.play().catch(function(){});
        mbtn.classList.remove('sorry-index-is-off');
      } else {
        bgm.pause();
        mbtn.classList.add('sorry-index-is-off');
      }
    });
  }

  /* ---------- Effects: ambient floating hearts ---------- */
  var ambient = $('#ambient');
  function floatHeart(){
    if(document.hidden){ return; }
    var set = ['💗','💖','🌸','✨','💕'];
    var s = document.createElement('span');
    var d = 7 + Math.random() * 6;
    s.className = 'sorry-index-float';
    s.textContent = set[Math.floor(Math.random() * set.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (.9 + Math.random() * 1.2) + 'rem';
    s.style.animationDuration = d + 's';
    s.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
    ambient.appendChild(s);
    setTimeout(function(){ s.remove(); }, d * 1000);
  }

  /* ---------- Effects: sparkle trail + click hearts ---------- */
  function spawn(cls, ch, x, y){
    var s = document.createElement('span');
    s.className = cls;
    s.textContent = ch;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    document.body.appendChild(s);
    return s;
  }

  if(!reduce){
    setInterval(floatHeart, 900);
    for(var k = 0; k < 6; k++){ setTimeout(floatHeart, k * 150); }

    var lastTrail = 0;
    if(window.matchMedia('(hover:hover)').matches){
      document.addEventListener('pointermove', function(e){
        var now = Date.now();
        if(now - lastTrail < 60){ return; }
        lastTrail = now;
        var t = spawn('sorry-index-trail', '✨', e.clientX, e.clientY);
        setTimeout(function(){ t.remove(); }, 900);
      });
    }

    document.addEventListener('click', function(e){
      for(var i = 0; i < 6; i++){
        var h = spawn('sorry-index-burst', i % 2 ? '💗' : '💖', e.clientX, e.clientY);
        var a = Math.random() * Math.PI * 2, r = 40 + Math.random() * 40;
        h.style.setProperty('--dx', Math.cos(a) * r + 'px');
        h.style.setProperty('--dy', Math.sin(a) * r + 'px');
        (function(el){ setTimeout(function(){ el.remove(); }, 800); })(h);
      }
    });
  }

  /* ---------- Gift 2: rose ---------- */
  $('#thanks').innerHTML = 'Thank you for accepting my sorry 🌹<small>— ' + CONFIG.from + '</small>';

  /* ---------- Gift 3: letter ---------- */
  var html = '<h2>Dear ' + CONFIG.friend + ',</h2>';
  CONFIG.letter.forEach(function(t, i){
    html += '<p style="--i:' + i + '">' + t + '</p>';
  });
  html += '<p class="sorry-index-sig" style="--i:' + CONFIG.letter.length + '">Your best friend,<br>' + CONFIG.from + '</p>';
  $('#paper').innerHTML = html;

  /* ---------- Decorations: drifting, twinkling emoji on every screen ---------- */
  function decorate(id, per){
    ['🌸','💗','🌷','✨'].forEach(function(e){
      for(var i = 0; i < per; i++){
        var s = document.createElement('span');
        s.className = 'sorry-index-deco';
        s.textContent = e;
        s.style.cssText += 'left:' + Math.random() * 92 + '%;top:' + Math.random() * 88 + '%;font-size:' + (1.6 + Math.random() * 2) + 'rem;transform:rotate(' + (Math.random() * 60 - 30) + 'deg);animation-delay:-' + (Math.random() * 5) + 's';
        $('#' + id).appendChild(s);
      }
    });
  }
  decorate('p3', 4);
  decorate('rose', 3);
  decorate('gifts', 2);
  decorate('p1', 2);
})();
</script>

</body>
</html>
